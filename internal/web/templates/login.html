{{template "head" .}}
<h1>登入</h1>
{{if .Err}}<p class="err">{{.Err}}</p>{{end}}
<form method="post" action="/login">
  <label>Email<input type="email" name="email" value="{{.Email0}}" required autofocus></label>
  <label>密碼<input type="password" name="password" required></label>
  <button class="primary">登入</button>
</form>
<p>還沒有帳號？<a href="/register">註冊</a></p>
{{template "foot" .}}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cronwatch
      POSTGRES_PASSWORD: cronwatch
      POSTGRES_DB: cronwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 本機收信用，不是正式環境的一部分。UI 在 http://localhost:8025
  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
